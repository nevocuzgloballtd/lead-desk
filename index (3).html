<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead desk</title>
<style>
:root{--bg:#f2f5f3;--panel:#fff;--ink:#14211c;--mute:#5d6b65;--line:#d6ddd9;--acc:#0f766e;--accInk:#fff;--warn:#b45309;--warnBg:#fef3c7;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--panel:#17221e;--ink:#e6efeb;--mute:#93a39b;--line:#2b3a34;--acc:#2dd4bf;--accInk:#062622;--warn:#fbbf24;--warnBg:#3a2c0a;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Manrope",ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;font:inherit;color:var(--mute);cursor:pointer}
nav button.on{background:var(--acc);color:var(--accInk);font-weight:600}
nav .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:12px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:20px}
section{display:none}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);flex:1;min-width:180px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--accInk);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:wait}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td small{display:block;color:var(--mute)}
td select{padding:5px 6px;width:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--mute)}.due{background:var(--warnBg);border-left:4px solid var(--warn)}
.fu{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel)}
.tbl{overflow-x:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90vw;z-index:20}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
</style>
</head>
<body>
<header>
  <h1>Lead desk</h1>
  <nav id="nav">
    <button data-t="leads" class="on">Leads</button>
    <button data-t="find">Find leads</button>
    <button data-t="fu">Follow-ups<span class="n" id="dueN" hidden>0</span></button>
    <button data-t="set">Settings</button>
  </nav>
</header>
<main>
<section id="leads" class="on">
  <div class="card row">
    <label>Search<input id="q" placeholder="Name, phone or address"></label>
    <label style="max-width:200px">Status<select id="fs"></select></label>
    <button class="btn ghost" id="exp">Export CSV</button>
  </div>
  <div class="card tbl"><table><thead><tr><th>Business</th><th>Phone</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody id="lb"></tbody></table>
  <p class="muted" id="le"></p></div>
</section>

<section id="find">
  <div class="card">
    <div class="row">
      <label>Business type<input id="fk" placeholder="e.g. barber shop"></label>
      <label>Area<input id="fa" placeholder="e.g. Lekki, Lagos"></label>
      <label style="max-width:170px">Pages of results<select id="fp"><option>1</option><option selected>2</option><option>3</option></select></label>
      <button class="btn" id="fg">Find businesses without a website</button>
    </div>
    <p class="hint">Only businesses with no website listed on Google Maps are added. Duplicates are skipped.</p>
    <p id="fs2" class="hint"></p>
  </div>
</section>

<section id="fu">
  <div class="card"><h2 style="margin:0 0 12px;font-size:16px">Follow-ups</h2><div id="fl"></div></div>
</section>

<section id="set">
  <div class="card">
    <h2 style="margin:0 0 12px;font-size:16px">Reminders</h2>
    <p class="hint">Follow-up reminders show up as a pop-up and, if enabled, a browser notification while this page is open.</p>
    <div class="row" style="margin-top:12px"><button class="btn" id="nt">Enable reminder notifications</button><button class="btn ghost" id="lo">Sign out</button></div>
  </div>
</section>
</main>

<dialog id="dlg">
  <form method="dialog" id="df">
    <h3 style="margin:0 0 12px" id="dt">Set follow-up</h3>
    <label>Call back on<input type="datetime-local" id="dd" required></label>
    <label style="margin-top:10px">Note<input id="dn" placeholder="What they asked for"></label>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok">Save follow-up</button></div>
  </form>
</dialog>
<dialog id="lg"><form id="lf"><h3 style="margin:0 0 12px">Sign in</h3><label>Password<input type="password" id="lp" required autocomplete="current-password"></label><p class="hint" id="le2"></p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn">Sign in</button></div></form></dialog>
<div id="toast" role="status"></div>

<script>
const STATUS=["New","Called","No answer","Interested","Follow-up","Closed","Not interested"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S={leads:[]};
async function api(p,o={}){const r=await fetch("/api/"+p,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o});if(r.status===401){showLogin();throw new Error("Sign in required")}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
const save=()=>{};
const persist=l=>api("leads",{method:"PUT",body:JSON.stringify(l)}).catch(e=>toast("Couldn't save: "+e.message));
async function load(){try{S.leads=(await api("leads")).leads;render()}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4000)}
const fmt=d=>new Date(d).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});

$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));render()};

$("#fs").innerHTML='<option value="">All</option>'+STATUS.map(s=>`<option>${s}</option>`).join("");
$("#q").oninput=$("#fs").onchange=renderLeads;

function renderLeads(){
  const q=$("#q").value.toLowerCase(),f=$("#fs").value;
  const rows=S.leads.filter(l=>(!f||l.status===f)&&(!q||(l.name+l.phone+l.address).toLowerCase().includes(q)));
  $("#lb").innerHTML=rows.map(l=>`<tr>
    <td><b>${esc(l.name)}</b><small>${esc(l.address)}</small>${l.maps?`<small><a href="${esc(l.maps)}" target="_blank" rel="noopener">Open in Maps</a>${l.rating?` · ${l.rating}★ (${l.count||0})`:""}</small>`:""}</td>
    <td>${l.phone?esc(l.phone):'<span class="muted">Not listed</span>'}</td>
    <td><select data-id="${l.id}" data-a="status">${STATUS.map(s=>`<option${s===l.status?" selected":""}>${s}</option>`).join("")}</select>${l.followAt?`<small>Call back ${fmt(l.followAt)}</small>`:""}</td>
    <td><textarea rows="2" data-id="${l.id}" data-a="notes" placeholder="Add notes">${esc(l.notes)}</textarea></td>
    <td><div class="acts"><button class="btn sm" data-id="${l.id}" data-a="call"${l.phone?"":" disabled"}>Call</button><button class="btn ghost sm" data-id="${l.id}" data-a="fu">Follow up</button><button class="btn ghost sm" data-id="${l.id}" data-a="del">Delete</button></div></td></tr>`).join("");
  $("#le").textContent=rows.length?"":(S.leads.length?"No leads match this filter.":"No leads yet. Open Find leads to pull businesses from Google Maps.");
}
$("#lb").onchange=e=>{const t=e.target,l=S.leads.find(x=>x.id===t.dataset.id);if(!l)return;if(t.dataset.a==="status"){l.status=t.value;persist(l);renderLeads()}if(t.dataset.a==="notes"){l.notes=t.value;persist(l)}};
$("#lb").onclick=e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id,l=S.leads.find(x=>x.id===id);
  if(b.dataset.a==="call")callLead(l);
  if(b.dataset.a==="fu")openFu(l);
  if(b.dataset.a==="del"&&confirm("Delete "+l.name+"?")){api("leads?id="+encodeURIComponent(id),{method:"DELETE"}).catch(e=>toast(e.message));S.leads=S.leads.filter(x=>x.id!==id);render()}};

async function callLead(l){
  try{await api("call",{method:"POST",body:JSON.stringify({id:l.id})});toast("Calling "+l.name+"...");if(l.status==="New")l.status="Called";l.lastCall=Date.now();renderLeads()}
  catch(e){toast("Call failed: "+e.message)}
}

let fuId=null;
function openFu(l){fuId=l.id;$("#dt").textContent="Follow up with "+l.name;const d=new Date(Date.now()+864e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());d.setHours(10,0);$("#dd").value=l.followAt?new Date(l.followAt-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):d.toISOString().slice(0,16);$("#dn").value=l.followNote||"";$("#dlg").showModal()}
$("#dlg").onclose=()=>{if($("#dlg").returnValue!=="ok")return;const l=S.leads.find(x=>x.id===fuId);if(!l)return;l.followAt=new Date($("#dd").value).getTime();l.followNote=$("#dn").value;l.notified=false;l.status="Follow-up";persist(l);render();toast("Follow-up saved")};

function renderFu(){
  const list=S.leads.filter(l=>l.followAt).sort((a,b)=>a.followAt-b.followAt),now=Date.now();
  $("#fl").innerHTML=list.length?list.map(l=>`<div class="fu${l.followAt<=now?" due":""}"><div><b>${esc(l.name)}</b> <span class="muted">${esc(l.phone||"No number")}</span><small class="muted" style="display:block">${l.followAt<=now?"Due now · ":""}${fmt(l.followAt)}${l.followNote?" · "+esc(l.followNote):""}</small></div><div class="acts"><button class="btn sm" data-id="${l.id}" data-a="call"${l.phone?"":" disabled"}>Call</button><button class="btn ghost sm" data-id="${l.id}" data-a="fu">Reschedule</button><button class="btn ghost sm" data-id="${l.id}" data-a="done">Mark done</button></div></div>`).join(""):'<p class="muted">Nothing scheduled. Use Follow up on a lead when they ask you to call back.</p>';
}
$("#fl").onclick=e=>{const b=e.target.closest("button");if(!b)return;const l=S.leads.find(x=>x.id===b.dataset.id);if(!l)return;
  if(b.dataset.a==="call")callLead(l);if(b.dataset.a==="fu")openFu(l);
  if(b.dataset.a==="done"){delete l.followAt;delete l.followNote;persist(l);render()}};

function checkDue(){
  const now=Date.now();let fresh=[];
  S.leads.forEach(l=>{if(l.followAt&&l.followAt<=now&&!l.notified){l.notified=true;fresh.push(l)}});
  if(fresh.length){fresh.forEach(l=>persist(l));fresh.forEach(l=>{toast("Call back "+l.name+(l.phone?" · "+l.phone:""));try{if(Notification.permission==="granted")new Notification("Call back "+l.name,{body:(l.phone||"")+(l.followNote?" · "+l.followNote:"")})}catch(e){}});renderFu()}
  const n=S.leads.filter(l=>l.followAt&&l.followAt<=now).length;
  $("#dueN").hidden=!n;$("#dueN").textContent=n;document.title=(n?"("+n+") ":"")+"Lead desk";
}
setInterval(checkDue,20000);

async function findLeads(){
  const kw=$("#fk").value.trim(),ar=$("#fa").value.trim(),st=$("#fs2");
  if(!kw||!ar){st.textContent="Enter a business type and an area.";return}
  const b=$("#fg");b.disabled=true;st.textContent="Searching Google Maps...";
  try{const d=await api("search",{method:"POST",body:JSON.stringify({keyword:kw,area:ar,pages:+$("#fp").value})});await load();st.textContent=`Checked ${d.seen} businesses. ${d.noSite} have no website. ${d.added} new leads added.`}
  catch(err){st.textContent="Search failed: "+err.message}
  b.disabled=false;
}
$("#fg").onclick=findLeads;

$("#nt").onclick=async()=>{try{const p=await Notification.requestPermission();toast(p==="granted"?"Reminder notifications on":"Notifications blocked in this browser")}catch(e){toast("Notifications aren't supported here")}};
$("#exp").onclick=()=>{const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const csv=["Name,Phone,Address,Status,Notes,Follow-up"].concat(S.leads.map(l=>[l.name,l.phone,l.address,l.status,l.notes,l.followAt?new Date(l.followAt).toISOString():""].map(c).join(","))).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="leads.csv";a.click()};

function render(){renderLeads();renderFu();checkDue()}
render();load();

function showLogin(){const d=$("#lg");if(!d.open)d.showModal()}
$("#lg").oncancel=e=>e.preventDefault();
$("#lf").onsubmit=async e=>{e.preventDefault();try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#lp").value})});if(!r.ok)throw new Error((await r.json()).error||"Wrong password");$("#lp").value="";$("#le2").textContent="";$("#lg").close();load()}catch(err){$("#le2").textContent=err.message}};
$("#lo").onclick=async()=>{await fetch("/api/login",{method:"DELETE"});S.leads=[];render();showLogin()};
</script>
</body>
</html>
